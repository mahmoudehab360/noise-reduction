name: build-windows

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Download FFmpeg (bundled next to the exe)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          $ff = Get-ChildItem -Path ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $ff.FullName dist/
          Copy-Item (Join-Path $ff.DirectoryName "ffprobe.exe") dist/

      - name: Package
        shell: pwsh
        run: |
          Copy-Item target/release/lowlight-dn.exe dist/
          Copy-Item README.md dist/

      - uses: actions/upload-artifact@v4
        with:
          name: LowLight-DN-windows
          path: dist
